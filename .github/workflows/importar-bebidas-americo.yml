name: Importar 10 fotos de bebidas do Américo
on:
  push:
    branches: [main]
    paths:
      - 'importar-imagens/americo_do_peixe_bebidas_10_imagens.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validar e instalar as imagens
        run: |
          python3 - <<'PY'
          import json,zipfile,hashlib,pathlib
          path=pathlib.Path("importar-imagens/americo_do_peixe_bebidas_10_imagens.zip")
          if not path.exists(): raise SystemExit("ZIP de bebidas não encontrado")
          expected={"coca-cola-lata.webp","coca-cola-1-litro.webp","fanta-laranja-lata.webp","pepsi-lata.webp","h2oh-limao.webp","suco-jarra-laranja.webp","suco-maracuja-copo.webp","heineken-long-neck.webp","amstel-600ml.webp","vinho-tinto-taca.webp"}
          dest=pathlib.Path("docs/americo-do-peixe/imagens/bebidas")
          dest.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(path) as z:
            manifest=json.loads(z.read("manifesto.json"))
            if len(manifest)!=10 or {x["imagem"] for x in manifest}!=expected: raise SystemExit("O ZIP precisa conter exatamente as dez fotos esperadas")
            for item in manifest:
              filename=item["imagem"]
              data=z.read(filename)
              if len(data)>3000000 or len(data)<1000: raise SystemExit("Tamanho inesperado em "+filename)
              if data[:4]!=b"RIFF" or data[8:12]!=b"WEBP": raise SystemExit("Imagem WEBP invalida: "+filename)
              if hashlib.sha256(data).hexdigest()!=item["sha256"]: raise SystemExit("Verificação SHA256 falhou: "+filename)
              (dest/filename).write_bytes(data)
            print("Importadas",len(manifest),"fotos de bebidas")
          PY
      - name: Publicar arquivos no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/americo-do-peixe/imagens/bebidas
          if ! git diff --cached --quiet; then
            git commit -m "Adiciona fotos profissionais individuais das bebidas do Américo"
            git pull --rebase
            git push
          fi
